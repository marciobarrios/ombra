name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm budget
      - run: pnpm registry:validate

  # One job per Playwright project, so the projects run side by side and each installs one browser.
  # The frame budget samples on a runner of its own, so no other test competes with it for the CPU.
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium
            browser: chromium
            projects: --project=unit --project=chromium
          - name: chromium-mobile
            browser: chromium
            projects: --project=chromium-mobile
          - name: webkit
            browser: webkit
            projects: --project=webkit
          - name: webkit-mobile
            browser: webkit
            projects: --project=webkit-mobile
          - name: frame-budget
            browser: chromium
            projects: --project=frame-budget --no-deps
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e ${{ matrix.projects }}
      - name: Upload Playwright failure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ matrix.name }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  # Branch protection requires a check named "check". It passes only when every job above passed.
  check:
    if: always()
    needs: [static, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.static.result }}" = success && test "${{ needs.e2e.result }}" = success
